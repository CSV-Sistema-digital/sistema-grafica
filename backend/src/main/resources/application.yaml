spring:
  application:
    name: backend

  datasource:
    url: ${DB_URL_CSV}
    username: ${DB_USERNAME_CSV}
    password: ${DB_PASSWORD_CSV}
    driver-class-name: org.postgresql.Driver

    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      idle-timeout: 60000
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${SUPABASE_URL}/auth/v1
          jwk-set-uri: ${SUPABASE_URL}/auth/v1/.well-known/jwks.json

server:
  port: ${PORT:8080}

logging:
  level:
    org.springframework.security: INFO

app:
  cors:
    allowed-origins: ${FRONTEND_ORIGINS:http://localhost:5500,http://127.0.0.1:5500}