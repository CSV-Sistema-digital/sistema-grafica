spring:
  application:
    name: backend

  datasource:
    url: ${DB_URL_CSV}
    username: ${DB_USERNAME_CSV}
    password: ${DB_PASSWORD_CSV}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${SUPABASE_URL}/auth/v1
          jwk-set-uri: ${SUPABASE_URL}/auth/v1/.well-known/jwks.json